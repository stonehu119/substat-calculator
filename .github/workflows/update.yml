name: Add/Update Data and Create PR

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Comma-separated character/LC names, exactly as they appear on nanoka.'
        required: true
        type: string

jobs:
  update-and-create-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        id: update
        env:
          NAMES: ${{ inputs.names }}
        run: npm run add-items -- "$NAMES"

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update data for version ${{ steps.update.outputs.version }}"
          title: "Automated update for version ${{ steps.update.outputs.version }}"
          body: |
            This PR was automatically generated by a GitHub Actions workflow.

            **Data version:** ${{ steps.update.outputs.version }}

            **Items added/updated:**
            ${{ inputs.names }}
          branch: "update/${{ steps.update.outputs.version }}"
          base: "main"
          delete-branch: true